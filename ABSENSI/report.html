<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<meta name="theme-color" content="#2563eb"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<title>Portal Report Absensi — Presensi</title>

<link rel="stylesheet" href="assets/css/main.css"/>
<style>
/* ===== REPORT-SPECIFIC STYLES (print preview, kop surat, etc.) ===== */
:root {
  --success: #16a34a; --danger: #ef4444; --warning: #f59e0b;
  --info: #06b6d4; --purple: #7c3aed;
}
#previewArea { width: 100%; overflow: auto; }
.preview-card {
  background: #fff; width: 297mm; min-height: 190mm;
  margin: 0 auto; padding: 8mm; border-radius: 18px;
  box-shadow: 0 10px 30px rgba(0,0,0,.08); overflow: visible !important;
  color: #0f172a;
}
.kop-surat { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 12px; }
.kop-left, .kop-right { width: 78px; flex-shrink: 0; }
.kop-left img, .kop-right img { width: 78px; height: 78px; object-fit: contain; }
.kop-center { flex: 1; text-align: center; }
.kop-line { line-height: 1.35; }
.kop-line.big { font-size: 15px; font-weight: 800; }
.kop-line.sekolah { font-size: 24px; font-weight: 800; }
.kop-line.alamat { font-size: 11px; margin-top: 4px; }
.kop-divider { border-top: 3px solid #0f172a; margin-top: 10px; margin-bottom: 18px; }
.preview-title { text-align: center; font-size: 24px; font-weight: 800; margin-bottom: 8px; }
.preview-sub { text-align: center; font-size: 14px; color: #475569; margin-bottom: 8px; }
.preview-date, .periode-wrap { text-align: center; font-size: 13px; font-weight: 700; color: #334155; margin-bottom: 18px; }
.preview-table { width: 100%; border-collapse: collapse; table-layout: fixed; vertical-align: middle; }
.preview-table th { background: #eff6ff; color: #1d4ed8; border: 1px solid #cbd5e1; font-size: 8px; padding: 4px; white-space: nowrap; vertical-align: middle; font-weight: 800; }
.preview-table td { border: 1px solid #e2e8f0; text-align: center; font-size: 7px; padding: 3px; white-space: nowrap; vertical-align: middle; }
.preview-table td:nth-child(2) { text-align: left; font-weight: 700; }
.bulanan-table th, .bulanan-table td { font-size: 6px !important; padding: 2px !important; }
.badge-h { color: var(--success); font-weight: 800; }
.badge-s { color: var(--warning); font-weight: 800; }
.badge-i { color: var(--info); font-weight: 800; }
.badge-a { color: var(--danger); font-weight: 800; }
.badge-c { color: var(--purple); font-weight: 800; }
.ttd-wrap { display: flex; justify-content: flex-end; margin-top: 26px; }
.ttd-box { width: 240px; font-size: 11px; line-height: 1.8; }
.ttd-name { margin-top: 60px; font-weight: 800; text-decoration: underline; }
.report-guru-card { width: 100% !important; overflow: visible !important; }
.report-guru-wrap { overflow: auto; }
.guru-table { width: max-content; min-width: 100%; border-collapse: collapse; table-layout: auto; }
.guru-table th { background: #eff6ff; color: #1d4ed8; border: 1px solid #cbd5e1; font-size: 8px; font-weight: 800; padding: 4px; text-align: center; white-space: nowrap; }
.guru-table td { border: 1px solid #e2e8f0; font-size: 8px; padding: 3px; text-align: center; white-space: nowrap; }
.guru-table .nama-siswa { text-align: left; min-width: 220px; font-weight: 700; }
.guru-table .col-pertemuan { min-width: 32px; }
/* Info items in report */
.report-info-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 14px; }
.report-info-item { position: relative; overflow: hidden; background: var(--surface2); border-radius: var(--r-sm); padding: 16px; border: 1px solid var(--border); }
.report-info-item::before { content: ""; position: absolute; top: 0; left: 0; width: 100%; height: 3px; background: linear-gradient(90deg, var(--primary), #60a5fa); }
.report-info-item span { display: block; margin-bottom: 6px; font-size: 12px; font-weight: 700; color: var(--text-soft); }
.report-info-item strong { font-size: 18px; font-weight: 800; color: var(--text); }
/* Print */
@media print {
  .sidebar, .topbar, .btn-menu-toggle, .filter-card, .page-header, .btn, .card:not(#previewWrapper) { display: none !important; }
  .main-content { margin-left: 0; padding: 0; }
  body { background: #fff; }
  .preview-card { width: 100%; min-height: auto; margin: 0; padding: 5mm; border-radius: 0; box-shadow: none; overflow: visible !important; }
  .table-wrap, .report-guru-wrap { overflow: visible !important; }
}
@page { size: A4 landscape; margin: 5mm; }
@media (max-width: 900px) {
  .preview-card { width: 100%; min-width: 1100px; overflow: visible !important; }
  .kop-left, .kop-right { display: none; }
}
</style>
</head>

  <main class="main-content">

<script>
function toggleSidebar() { document.body.classList.toggle('sidebar-open'); }
function closeSidebar() { document.body.classList.remove('sidebar-open'); }

const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbw_6HNjl9sS8PqlDvOwnlUCEc5ZOgBbEXjOT2KgGlMsoAWcUqOMSS6U5rrD6-CSmvs/exec";
const userData = JSON.parse(localStorage.getItem("userData") || "null");

function escapeHTML(str) {
  if (str === null || str === undefined) return "";
  return String(str).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;");
}

window.onload = async () => {
  // Build role-aware sidebar
  buildSidebar('report.html');

  const now = new Date();
  const localDate = now.getFullYear() + "-" + String(now.getMonth()+1).padStart(2,"0") + "-" + String(now.getDate()).padStart(2,"0");
  const localMonth = now.getFullYear() + "-" + String(now.getMonth()+1).padStart(2,"0");
  document.getElementById("tanggal").value = localDate;
  document.getElementById("bulan").value = localMonth;

  await loadKelas();
  await loadGuru();

  // Ambil data user yang login (gabungkan userData + user)
  const userRaw = JSON.parse(localStorage.getItem("user") || "null");
  const uData = JSON.parse(localStorage.getItem("userData") || "null");
  const activeUser = uData || userRaw || {};
  const role = String(activeUser.role || '').trim().toLowerCase();
  const namaLogin = activeUser.nama || activeUser.nama_guru || activeUser.username || '';
  const mapelLogin = activeUser.mapel || '';
  const kelasWali = activeUser.kelas || activeUser.kelas_wali || '';

  if (role === 'guru') {
    // Mode guru: pre-select guru yang login
    document.getElementById("modeReport").value = "guru";
    document.getElementById("guruForm").style.display = "block";
    const sel = document.getElementById("namaGuru");
    for (let i = 0; i < sel.options.length; i++) {
      if (sel.options[i].value === namaLogin) {
        sel.selectedIndex = i;
        document.getElementById("mapel").value = sel.options[i].getAttribute("data-mapel") || mapelLogin;
        window.guruNip = sel.options[i].getAttribute("data-nip") || activeUser.nip || "-";
        break;
      }
    }
    // Jika tidak ditemukan di list, isi manual
    if (!document.getElementById("namaGuru").value && namaLogin) {
      document.getElementById("mapel").value = mapelLogin;
    }
  } else if (role === 'wali') {
    // Mode wali: auto-pilih kelas wali
    document.getElementById("modeReport").value = "wali";
    document.getElementById("guruForm").style.display = "none";
    const kelasSel = document.getElementById("kelas");
    // Coba cocokkan kelas wali dari data user
    let matched = false;
    if (kelasWali) {
      for (let i = 0; i < kelasSel.options.length; i++) {
        if (kelasSel.options[i].value === kelasWali) {
          kelasSel.selectedIndex = i;
          await loadWaliKelas(kelasWali);
          matched = true;
          break;
        }
      }
    }
    // Fallback: pilih kelas pertama
    if (!matched && kelasSel.options.length > 1) {
      kelasSel.selectedIndex = 1;
      await loadWaliKelas(kelasSel.value);
    }
  } else if (role === 'admin') {
    // Admin: tidak ada auto-fill, bisa pilih bebas
  }
};

function parseTanggal(str) { const [y,m,d] = str.split("-"); return new Date(y,m-1,d); }

function showLoading() { document.getElementById("loadingOverlay").classList.add("show"); document.getElementById("loadingOverlay").style.display = "flex"; }
function hideLoading() { document.getElementById("loadingOverlay").classList.remove("show"); document.getElementById("loadingOverlay").style.display = "none"; }

document.getElementById("modeReport").addEventListener("change", function() {
  document.getElementById("guruForm").style.display = this.value === "guru" ? "block" : "none";
});

function formatTanggalIndonesia(date) {
  return new Date(date).toLocaleDateString("id-ID", { day:"numeric", month:"long", year:"numeric" });
}
function formatBulanIndonesia(value) {
  const bulan = ["Januari","Februari","Maret","April","Mei","Juni","Juli","Agustus","September","Oktober","November","Desember"];
  const split = value.split("-");
  return bulan[Number(split[1])-1] + " " + split[0];
}

async function loadGuru() {
  try {
    const res = await fetch(WEB_APP_URL + "?action=getGuru");
    const json = await res.json();
    const select = document.getElementById("namaGuru");
    select.innerHTML = '<option value="">Pilih Guru</option>';
    (json.data || []).forEach(guru => {
      select.innerHTML += `<option value="${escapeHTML(guru.nama)}" data-mapel="${escapeHTML(guru.mapel||"")}" data-nip="${escapeHTML(guru.nip||"")}">${escapeHTML(guru.nama)}</option>`;
    });
  } catch(err) { console.log(err); alert("Gagal load guru"); }
}

async function loadKelas() {
  try {
    const res = await fetch(WEB_APP_URL + "?action=getKelas");
    const json = await res.json();
    const select = document.getElementById("kelas");
    select.innerHTML = '<option value="">Pilih Kelas</option>';
    (json.data || json.kelas || []).forEach(kls => { select.innerHTML += `<option value="${kls}">${kls}</option>`; });
  } catch(err) { console.log(err); alert("Gagal load kelas"); }
}

async function loadWaliKelas(kelas) {
  try {
    const res = await fetch(WEB_APP_URL + "?action=getWaliKelas&kelas=" + encodeURIComponent(kelas));
    const json = await res.json();
    if (!json.success || !json.data) return;
    document.getElementById("waliNama").innerText = json.data.nama || "-";
    document.getElementById("waliNip").innerText = json.data.nip || "-";
  } catch(err) { console.log(err); }
}

document.getElementById("kelas").addEventListener("change", async function() { if (this.value) await loadWaliKelas(this.value); });
document.getElementById("namaGuru").addEventListener("change", function() {
  const selected = this.options[this.selectedIndex];
  document.getElementById("mapel").value = selected.getAttribute("data-mapel") || "";
  window.guruNip = selected.getAttribute("data-nip") || "-";
});

function getKopSurat() {
  return `<div class="kop-surat">
    <div class="kop-left"><img src="./assets/logo_riau.png" alt="Logo"/></div>
    <div class="kop-center">
      <div class="kop-line big">PEMERINTAH PROVINSI RIAU</div>
      <div class="kop-line big">DINAS PENDIDIKAN</div>
      <div class="kop-line sekolah">SMKN 1 KUANTAN MUDIK</div>
      <div class="kop-line alamat">Jalan Air Panas Alam Pulau Desa Pulau Binjai Telp : Kode Pos : 29564 email:smknkuantanmudik@gmail.com</div>
    </div>
    <div class="kop-right"><img src="./assets/logo_sekolah.png" alt="Logo"/></div>
  </div><div class="kop-divider"></div>`;
}

async function tampilkanHarian() {
  try {
    showLoading();
    const kelas = document.getElementById("kelas").value;
    const tanggal = document.getElementById("tanggal").value;
    if (!kelas) { alert("Pilih kelas"); hideLoading(); return; }
    document.getElementById("statusText").innerText = "Loading Harian...";
    const res = await fetch(WEB_APP_URL + "?action=getDashboardPiket&kelas=" + encodeURIComponent(kelas) + "&tanggal=" + encodeURIComponent(tanggal));
    const json = await res.json();
    if (!json.success || !json.data || !json.data.length) { alert("Data tidak ditemukan"); hideLoading(); return; }
    renderTabelHarian(json.data[0]);
    document.getElementById("statusText").innerText = "Data Harian Tampil";
    hideLoading();
  } catch(err) { console.log(err); document.getElementById("statusText").innerText = "Gagal Load"; hideLoading(); alert("Gagal load data"); }
}

function renderTabelHarian(data) {
  const siswa = data.siswaList || [];
  let html = `<div class="preview-card">${getKopSurat()}<div class="preview-title">REKAP ABSENSI HARIAN</div><div class="preview-sub">Kelas ${data.kelas}</div><div class="preview-date">${formatTanggalIndonesia(document.getElementById("tanggal").value)}</div><div class="table-wrap"><table class="preview-table"><thead><tr><th>No</th><th>Nama Siswa</th>`;
  for (let j=1;j<=11;j++) html += `<th>${j}</th>`;
  html += `</tr></thead><tbody>`;
  siswa.forEach((s,index) => {
    html += `<tr><td>${index+1}</td><td>${escapeHTML(s.nama)}</td>`;
    for (let j=1;j<=11;j++) {
      const st = s.jam?.[j] || "-";
      let isi = st, cls = "";
      if (st==="H") { isi="✓"; cls="badge-h"; }
      if (st==="S") cls="badge-s"; if (st==="I") cls="badge-i"; if (st==="A") cls="badge-a"; if (st==="C") cls="badge-c";
      html += `<td class="${cls}">${isi}</td>`;
    }
    html += `</tr>`;
  });
  html += `</tbody></table></div><div class="ttd-wrap"><div class="ttd-box"><div>Lubuk Jambi, ${formatTanggalIndonesia(new Date())}</div><div>Mengetahui,</div><div>Wali Kelas</div><div class="ttd-name">${document.getElementById("waliNama").innerText}</div><div>NIP. ${document.getElementById("waliNip").innerText}</div></div></div></div>`;
  document.getElementById("previewArea").innerHTML = html;
}

async function tampilkanReportGuru() {
  try {
    showLoading();
    const kelas = document.getElementById("kelas").value;
    const guru = document.getElementById("namaGuru").value;
    const mapel = document.getElementById("mapel").value;
    const bulan = document.getElementById("bulan").value;
    if (!kelas) { alert("Pilih kelas"); hideLoading(); return; }
    if (!guru) { alert("Pilih guru"); hideLoading(); return; }
    document.getElementById("statusText").innerText = "Loading Report Guru...";
    const res = await fetch(WEB_APP_URL + "?action=getAbsensiGuru&kelas=" + encodeURIComponent(kelas) + "&guru=" + encodeURIComponent(guru) + "&bulan=" + encodeURIComponent(bulan));
    const json = await res.json();
    if (!json.success || !json.data || !json.data.length) { alert("Data guru tidak ditemukan"); hideLoading(); return; }
    const tanggalMap = {};
    json.data.forEach(item => { if (!tanggalMap[item.tanggal]) tanggalMap[item.tanggal] = true; });
    const tanggalList = Object.keys(tanggalMap).sort();
    const siswaMap = {};
    json.data.forEach(item => { if (!siswaMap[item.nisn]) siswaMap[item.nisn] = { nisn:item.nisn, nama:item.nama_siswa }; });
    const siswaList = Object.values(siswaMap);
    renderReportGuru({ kelas, guru, mapel, bulan, tanggalList, siswaList, allData: json.data });
    document.getElementById("statusText").innerText = "Report Guru Tampil";
    hideLoading();
  } catch(err) { console.log(err); alert("Gagal load report guru"); document.getElementById("statusText").innerText = "Gagal Load"; hideLoading(); }
}

function renderReportGuru(payload) {
  const { kelas, guru, mapel, bulan, siswaList, tanggalList, allData } = payload;
  const bulanAngka = Number(bulan.split("-")[1]);
  let semester = bulanAngka >= 1 && bulanAngka <= 6 ? "Genap" : "Ganjil";
  const tanggalFix = tanggalList.map(tgl => { const d = new Date(tgl); if (isNaN(d.getTime())) return tgl; return `${String(d.getDate()).padStart(2,"0")}-${String(d.getMonth()+1).padStart(2,"0")}`; });
  let html = `<div class="preview-card report-guru-card">${getKopSurat()}<div class="preview-title">REKAP ABSENSI GURU MAPEL</div><div class="preview-sub">${mapel}</div><div class="preview-sub">Kelas ${kelas}</div><div class="preview-sub" style="font-weight:800;margin-bottom:20px">Semester ${semester}</div><div class="report-guru-wrap"><table class="preview-table guru-table"><thead><tr><th rowspan="3">No</th><th rowspan="3">NAMA SISWA</th><th colspan="${tanggalList.length}">Pertemuan Ke / Tanggal</th></tr><tr>`;
  tanggalList.forEach((_,i) => { html += `<th class="col-pertemuan">${i+1}</th>`; });
  html += `</tr><tr>`;
  tanggalFix.forEach(label => { html += `<th class="col-pertemuan">${label}</th>`; });
  html += `</tr></thead><tbody>`;
  siswaList.forEach((siswa, index) => {
    html += `<tr><td>${index+1}</td><td class="nama-siswa">${siswa.nama}</td>`;
    tanggalList.forEach(tgl => {
      const dataSiswa = allData.filter(item => item.nisn === siswa.nisn && item.tanggal === tgl);
      let status = "-";
      if (dataSiswa.length) {
        const allStatus = dataSiswa.map(x => x.status);
        if (allStatus.includes("C")) status = "C"; else if (allStatus.includes("A")) status = "A"; else if (allStatus.includes("S")) status = "S"; else if (allStatus.includes("I")) status = "I"; else if (allStatus.includes("H")) status = "✓";
      }
      let cls = "";
      if (status==="✓") cls="badge-h"; if (status==="S") cls="badge-s"; if (status==="I") cls="badge-i"; if (status==="A") cls="badge-a"; if (status==="C") cls="badge-c";
      html += `<td class="${cls}">${status}</td>`;
    });
    html += `</tr>`;
  });
  html += `</tbody></table></div><div style="margin-top:18px;font-size:12px;display:flex;gap:26px;flex-wrap:wrap;font-weight:700"><div><span class="badge-h">✓</span> = Hadir</div><div><span class="badge-s">S</span> = Sakit</div><div><span class="badge-i">I</span> = Izin</div><div><span class="badge-a">A</span> = Alpha</div><div><span class="badge-c">C</span> = Cuti</div></div><div class="ttd-wrap"><div class="ttd-box"><div>Lubuk Jambi, ${formatTanggalIndonesia(new Date())}</div><div>Guru Mata Pelajaran</div><div class="ttd-name">${guru}</div><div>NIP. ${window.guruNip || "-"}</div></div></div></div>`;
  document.getElementById("previewArea").innerHTML = html;
}

async function tampilkanBulanan() {
  try {
    showLoading();
    const kelas = document.getElementById("kelas").value;
    const bulan = document.getElementById("bulan").value;
    if (!kelas) { alert("Pilih kelas"); hideLoading(); return; }
    document.getElementById("statusText").innerText = "Loading Bulanan...";
    const split = bulan.split("-");
    const tahun = Number(split[0]), bulanAngka = Number(split[1]);
    const totalHari = new Date(tahun, bulanAngka, 0).getDate();
    const requests = [];
    for (let t=1;t<=totalHari;t++) {
      const tanggal = `${tahun}-${String(bulanAngka).padStart(2,"0")}-${String(t).padStart(2,"0")}`;
      requests.push(fetch(WEB_APP_URL + "?action=getDashboardPiket&kelas=" + encodeURIComponent(kelas) + "&tanggal=" + encodeURIComponent(tanggal)).then(r=>r.json()).then(json=>({ tanggal, json })));
    }
    const results = [];
    for (const req of requests) { const result = await req; results.push(result); }
    let siswaMaster = [];
    const allData = [];
    results.forEach(item => {
      if (item.json && item.json.success && item.json.data && item.json.data.length) {
        const data = item.json.data[0];
        allData.push({ tanggal: item.tanggal, data });
        if (siswaMaster.length === 0) siswaMaster = data.siswaList || [];
      }
    });
    if (siswaMaster.length === 0) { alert("Data tidak ditemukan"); hideLoading(); return; }
    renderTabelBulanan({ kelas, bulan, siswaList: siswaMaster, allData });
    document.getElementById("statusText").innerText = "Data Bulanan Tampil";
    hideLoading();
  } catch(err) { console.log(err); document.getElementById("statusText").innerText = "Gagal Load"; hideLoading(); alert("Gagal load data bulanan"); }
}

function renderTabelBulanan(payload) {
  const { kelas, bulan, siswaList, allData } = payload;
  const split = bulan.split("-");
  const tahun = Number(split[0]), bulanAngka = Number(split[1]);
  const totalHari = new Date(tahun, bulanAngka, 0).getDate();
  let html = `<div class="preview-card">${getKopSurat()}<div class="periode-wrap">PERIODE : ${formatBulanIndonesia(bulan)}</div><div class="preview-title">REKAP ABSENSI BULANAN</div><div class="preview-sub">Kelas ${kelas}</div><div class="table-wrap"><table class="preview-table bulanan-table"><thead><tr><th>No</th><th>Nama Siswa</th>`;
  for (let t=1;t<=totalHari;t++) html += `<th>${t}</th>`;
  html += `<th>H</th><th>S</th><th>I</th><th>A</th><th>C</th></tr></thead><tbody>`;
  siswaList.forEach((siswa, index) => {
    let rekap = {H:0,S:0,I:0,A:0,C:0};
    html += `<tr><td>${index+1}</td><td>${escapeHTML(siswa.nama)}</td>`;
    for (let t=1;t<=totalHari;t++) {
      const tanggal = `${tahun}-${String(bulanAngka).padStart(2,"0")}-${String(t).padStart(2,"0")}`;
      const dayData = allData.find(d => d.tanggal === tanggal);
      let status = "-";
      if (dayData) {
        const siswaHari = (dayData.data.siswaList || []).find(x => x.nisn === siswa.nisn);
        if (siswaHari) {
          const jamData = Object.values(siswaHari.jam || {});
          if (jamData.includes("C")) status="C"; else if (jamData.includes("A")) status="A"; else if (jamData.includes("S")) status="S"; else if (jamData.includes("I")) status="I"; else if (jamData.includes("H")) status="H";
        }
      }
      if (status !== "-") rekap[status]++;
      let isi = status, cls = "";
      if (status==="H") { isi="✓"; cls="badge-h"; }
      if (status==="S") cls="badge-s"; if (status==="I") cls="badge-i"; if (status==="A") cls="badge-a"; if (status==="C") cls="badge-c";
      html += `<td class="${cls}">${isi}</td>`;
    }
    html += `<td class="badge-h">${rekap.H}</td><td class="badge-s">${rekap.S}</td><td class="badge-i">${rekap.I}</td><td class="badge-a">${rekap.A}</td><td class="badge-c">${rekap.C}</td></tr>`;
  });
  html += `</tbody></table></div><div class="ttd-wrap"><div class="ttd-box"><div>Lubuk Jambi, ${formatTanggalIndonesia(new Date())}</div><div>Mengetahui,</div><div>Wali Kelas</div><div class="ttd-name">${document.getElementById("waliNama").innerText}</div><div>NIP. ${document.getElementById("waliNip").innerText}</div></div></div></div>`;
  document.getElementById("previewArea").innerHTML = html;
}

function printHarian() { document.body.classList.remove("print-bulanan"); document.body.classList.add("print-harian"); window.print(); }
function printBulanan() { document.body.classList.remove("print-harian"); document.body.classList.add("print-bulanan"); window.print(); }
function printGuru() { document.body.classList.remove("print-harian","print-bulanan"); document.body.classList.add("print-guru"); window.print(); }
function printPreview() { window.print(); }
