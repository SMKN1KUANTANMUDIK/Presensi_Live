<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<meta name="theme-color" content="#2563eb"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="default"/>
<title>Login — Presensi SMKN 1 Kuantan Mudik</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="assets/css/main.css"/>
<style>
/* LOGIN PAGE SPECIFIC */
body {
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  padding: 20px;
  background: linear-gradient(135deg, #eff6ff 0%, #dbeafe 40%, #f0f9ff 100%);
  position: relative;
  overflow: hidden;
}
body.dark {
  background: linear-gradient(135deg, #060d1a 0%, #0f172a 60%, #060d1a 100%);
}
.bg-blob {
  position: absolute;
  border-radius: 50%;
  filter: blur(80px);
  opacity: .45;
  pointer-events: none;
  z-index: 0;
}
.bg-blob-1 { width: 400px; height: 400px; background: #bfdbfe; top: -150px; left: -150px; }
.bg-blob-2 { width: 350px; height: 350px; background: #c7d2fe; bottom: -120px; right: -120px; }
body.dark .bg-blob-1 { background: #1e3a5f; opacity: .3; }
body.dark .bg-blob-2 { background: #1e1b4b; opacity: .3; }

.login-wrap {
  width: 100%;
  max-width: 420px;
  position: relative;
  z-index: 10;
}
.login-logo {
  display: flex;
  justify-content: center;
  margin-bottom: 20px;
}
.login-logo img {
  width: 90px; height: 90px;
  object-fit: contain;
  border-radius: 22px;
  background: #fff;
  padding: 8px;
  box-shadow: 0 12px 32px rgba(37,99,235,.18);
}
.login-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 28px;
  padding: 36px 32px;
  box-shadow: 0 20px 60px rgba(15,23,42,.1);
}
.login-title {
  text-align: center;
  margin-bottom: 28px;
}
.login-title h1 {
  font-size: 22px; font-weight: 800;
  color: var(--text);
  margin-bottom: 6px;
  line-height: 1.3;
}
.login-title p { font-size: 13px; color: var(--text-soft); }
.error-box {
  display: none;
  background: var(--danger-soft);
  border: 1px solid #fca5a5;
  color: #991b1b;
  border-radius: var(--r-sm);
  padding: 12px 14px;
  font-size: 13px;
  font-weight: 600;
  margin-bottom: 16px;
}
.login-footer {
  text-align: center;
  margin-top: 20px;
  font-size: 12px;
  color: var(--text-muted);
  line-height: 1.8;
}
.theme-toggle-login {
  position: absolute;
  top: 16px; right: 16px;
  z-index: 20;
}
@media (max-width: 480px) {
  .login-card { padding: 28px 20px; border-radius: 22px; }
  .login-title h1 { font-size: 18px; }
}
</style>
</head>
<body>
<div class="bg-blob bg-blob-1"></div>
<div class="bg-blob bg-blob-2"></div>

<button class="btn-theme theme-toggle-login" onclick="toggleTheme()" title="Toggle Dark Mode">
  <svg class="theme-icon-moon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
  <svg class="theme-icon-sun" style="display:none" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
</button>

<div class="login-wrap">
  <div class="login-logo">
    <img src="./assets/logo_sekolah.png" alt="Logo SMKN 1 Kuantan Mudik"/>
  </div>

  <div class="login-card">
    <div class="login-title">
      <h1>SMKN 1 KUANTAN MUDIK</h1>
      <p>Sistem Monitoring Presensi Siswa</p>
    </div>

    <div class="error-box" id="errorBox"></div>

    <div class="form-group" style="margin-bottom:14px">
      <label>Username</label>
      <div class="input-group">
        <span class="input-icon">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        </span>
        <input type="text" id="username" class="form-control" placeholder="Masukkan username"/>
      </div>
    </div>

    <div class="form-group" style="margin-bottom:20px">
      <label>Password</label>
      <div class="input-group">
        <span class="input-icon">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        </span>
        <input type="password" id="password" class="form-control" placeholder="Masukkan password"
          onkeydown="if(event.key==='Enter') login()"/>
      </div>
    </div>

    <button class="btn btn-primary btn-full btn-lg" onclick="login()" id="btnLogin">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
      Login
    </button>

    <div class="info-msg loading" id="loading" style="display:none">Memproses login...</div>

    <div class="login-footer">
      © 2026 SMKN 1 Kuantan Mudik<br>
      by Waldo Guntala, S.Kom
    </div>
  </div>
</div>

<script src="assets/js/theme.js"></script>
<script src="assets/js/login.js"></script>
</body>
</html>
